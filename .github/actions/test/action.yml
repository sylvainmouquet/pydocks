name: Run Tests
description: Install dependencies, build the package, and run tests with coverage reporting.

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 10
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v2
    - name: Install just
      uses: extractions/setup-just@v2
    - name: Use uv with Python version
      run: uv venv --python ${{ matrix.python-version }}
      shell: bash
    - name: Install dependencies
      run: just install
      shell: bash
    - name: Build
      env:
        VERSION: 0.0.1
      run: just build
      shell: bash
    - name: Run tests with coverage
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          # ifconfig
          docker_ip=$(ip addr show docker0 | grep -Po 'inet \K[\d.]+')
          echo "Docker IP: $docker_ip"
          source .venv/bin/activate
          sudo echo "$docker_ip host.docker.internal" | sudo tee -a /etc/hosts
          ping -c 2 host.docker.internal

          just test-cov
        fi
        # elif [ "$RUNNER_OS" == "macOS" ]; then
        #   # ifconfig
        #   docker_ip=$(ifconfig en0 | awk '/inet / {print $2}')
        #   echo "Docker IP: $docker_ip"

        #   source .venv/bin/activate
        #   sudo echo "$docker_ip host.docker.internal" | sudo tee -a /etc/hosts
        #   ping -c 2 host.docker.internal
          
        #   find / -name docker.sock
        #   DOCKER_SOCK=~/.docker/run/docker.sock just test
        # elif [ "$RUNNER_OS" == "Windows" ]; then
        #   # .\.venv\Scripts\activate
        #   # $ipConfig = ipconfig | Select-String -Pattern 'IPv4 Address' | Select-Object -First 1
        #   # $ipAddress = $ipConfig -split ':' | Select-Object -Last 1 | ForEach-Object { $_.Trim() }
        #   # Add-Content -Path "$env:windir\System32\drivers\etc\hosts" -Value "$ipAddress host.docker.internal"
        #   # Test-Connection -ComputerName host.docker.internal -Count 2
        
        #   just test
        # fi
        

      shell: bash
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
    - name: Coverage summary
      if: always() && runner.os == 'Linux' && hashFiles('coverage.xml') != ''
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage.xml
        format: markdown
        output: file
    - name: Add coverage to job summary
      if: always() && runner.os == 'Linux' && hashFiles('code-coverage-results.md') != ''
      run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
      shell: bash
    - name: Upload coverage artifacts
      if: always() && runner.os == 'Linux' && hashFiles('coverage.xml') != ''
      uses: actions/upload-artifact@v4
      with:
        name: coverage-py${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
        retention-days: 14
