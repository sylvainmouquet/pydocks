[project]
name = "pydocks"
version = "2.0.0"
description = "Pytest fixures for running tests with Docker containers"
authors = [{name = "Sylvain Mouquet", email = "sylvain.mouquet@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

license = { text = "MIT" }
url = "https://github.com/sylvainmouquet/pydocks"
keywords = [
    "alpine",
    "containers",
    "docker",
    "opentofu",
    "postgresql",
    "pydocks",
    "redis",
    "test",
    "ubuntu",
    "valkey",
    "vault"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
homepage = "https://github.com/sylvainmouquet/pydocks"
documentation = "https://sylvainmouquet.github.io/pydocks/"
repository = "https://github.com/sylvainmouquet/pydocks"
changelog = "https://github.com/sylvainmouquet/pydocks/releases"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.10.10",
    "anyio>=4.6.0",
    "asyncpg>=0.30",
    "pip>=24.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.3",
    "reattempt>=1.0.10",
    "redis>=5.1.1",
    "ruff>=0.6.7",
    "pycontainers",
    "mkdocs-material>=9.6.0",
    "mkdocs-include-markdown-plugin>=7.0.0",
]

[tool.uv.sources]
pydocks = { path = "pydocks" }
pycontainers = { path = "../pycontainers" }
# asyncpg = { git = "https://github.com/MagicStack/asyncpg"}

[project.entry-points.pytest11]
pydocks = "pydocks"

[tool.coverage.run]
source = ["pydocks"]
omit = [
    "*/tests/*",
]
branch = false

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
